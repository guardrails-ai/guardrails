name: Server CI

on:
    push:
      branches:
        - main
      paths:
        - guardrails/**
        - pyproject.toml
    workflow_dispatch:
    workflow_call:  # Allows this workflow to be reused (e.g. by the Premerge workflow)

jobs:
    build-test-server:
        runs-on: ubuntu-latest
        steps:
            - name: Check out head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
              with:
                platforms: linux/amd64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
              with:
                platforms: linux/amd64

            - name: Build Docker image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                context: .
                file: server_ci/Dockerfile
                platforms: linux/amd64
                push: false
                tags: guardrails:server-ci
                load: true
                secrets: |
                  GUARDRAILS_TOKEN=${{ secrets.GUARDRAILS_API_KEY }}

            - name: Start Docker container
              env:
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  docker run -d --name guardrails-container -p 8000:8000 -e OPENAI_API_KEY=$OPENAI_API_KEY guardrails:server-ci
        
            - name: Wait for Docker container to be ready
              run: |
                for i in {1..30}; do
                if docker exec guardrails-container curl -s http://localhost:8000/; then
                    echo "Server is up!"
                    break
                fi
                echo "Waiting for server..."
                sleep 5
                done
    
            - name: Run Pytest
              run: |
                pip install pytest pytest-asyncio openai ".[api]"
                pytest server_ci/tests
                docker stop guardrails-container
                docker rm guardrails-container