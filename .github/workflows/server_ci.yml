name: Server CI

on:
    push:
      branches:
        - main
      paths:
        - guardrails/**
        - pyproject.toml
    workflow_dispatch:
    workflow_call:  # Allows this workflow to be reused (e.g. by the Premerge workflow)

jobs:
    build-test-server:
        runs-on: ubuntu-latest
        steps:
            - name: Check out head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              with:
                platforms: linux/amd64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                platforms: linux/amd64

            - name: Build Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                context: .
                file: server_ci/Dockerfile
                platforms: linux/amd64
                push: false
                tags: guardrails:server-ci
                load: true
                secrets: |
                  GUARDRAILS_TOKEN=${{ secrets.GUARDRAILS_API_KEY }}

            - name: Start Docker container
              env:
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  docker run -d --name guardrails-container -p 8000:8000 -e OPENAI_API_KEY=$OPENAI_API_KEY guardrails:server-ci
        
            - name: Wait for Docker container to be ready
              run: |
                for i in {1..30}; do
                if docker exec guardrails-container curl -s http://localhost:8000/; then
                    echo "Server is up!"
                    break
                fi
                echo "Waiting for server..."
                sleep 5
                done
    
            - name: Run Pytest
              run: |
                pip install pytest pytest-asyncio openai ".[api]"
                pytest server_ci/tests
                docker stop guardrails-container
                docker rm guardrails-container