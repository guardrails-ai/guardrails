name: Release PyPi Version

on:
  workflow_dispatch: # This event allows manual triggering

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.13.x

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: 2.1.1

      - name: Install dependencies
        run: make full

      - name: Install build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        shell: bash
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ -z "$version" ]; then
            echo "Could not read version from pyproject.toml" >&2
            exit 1
          fi
          echo "version_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Cut GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_tag="${{ steps.version.outputs.version_tag }}"
          # Idempotent: workflow_dispatch can be re-run, and the tag may already exist.
          if gh release view "$version_tag" >/dev/null 2>&1; then
            echo "Release $version_tag already exists; skipping."
            exit 0
          fi
          # Mark PEP 440 pre-releases (e.g. v0.11.0a1) as GitHub pre-releases.
          prerelease_flag=""
          if [[ "$version_tag" =~ (a|b|rc)[0-9]*$ ]]; then
            prerelease_flag="--prerelease"
          fi
          echo "Cutting GitHub Release for $version_tag $prerelease_flag"
          # --target creates the tag at this commit (this workflow does not tag separately).
          gh release create "$version_tag" \
            --title "$version_tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            $prerelease_flag
